<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosslet</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- ENCABEZADO -->
  <header class="header">
    <button id="helpBtn" class="icon-btn" aria-label="Ayuda">
      <!-- icono de ayuda integrado -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <div class="logo">
      <!-- logotipo integrado -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>
      <span>CROSSLET</span>
    </div>

    <button id="statsBtn" class="icon-btn" aria-label="Estadísticas">
      <!-- icono de estadísticas integrado -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </button>
  </header>

  <!-- MENÚ PRINCIPAL -->
  <main class="menu">
    <h1 class="title">Crosslet</h1>
    <p class="subtitle">Un desafío diario de palabras de cinco letras</p>
    
    <div class="menu-buttons">
      <a href="game.html" class="btn-primary">Jugar hoy</a>
      <button id="howBtn" class="btn-secondary">Cómo jugar</button>
    </div>

    <div class="mini-example">
      <div class="tile correct">C</div>
      <div class="tile">R</div>
      <div class="tile present">O</div>
      <div class="tile">S</div>
      <div class="tile absent">S</div>
    </div>
  </main>

  <!-- VENTANA DE AYUDA -->
  <div id="helpModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Cómo jugar</h2>
        <button class="icon-btn close-modal" data-close="helpModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <p>Adivina la palabra en 6 intentos. Después de cada intento, las casillas muestran qué tan cerca estás de la solución.</p>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);">
        <span style="font-size:14px; font-weight:600;">Sonido</span>
        <button id="toggleSoundsMenuBtn" class="btn-secondary" style="width:auto; height:36px; padding:0 16px; font-size:11px;" aria-pressed="true">Activado</button>
      </div>
      <a href="info.html" style="display:block; text-align:center; margin-top:16px; font-size:12px; color:var(--ink-light); text-decoration:underline;">Más información sobre Crosslet</a>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
